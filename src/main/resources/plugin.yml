name: DreamNPC
version: ${version}
main: cn.mythicland.dreamnpc.DreamNPCPlugin
author: ShanguanLinG
load: POSTWORLD
depend:
- DreamLib
description: Annotation-driven packet NPCs with command-bound interactions.
commands:
  dreamnpc:
    description: Manage DreamNPC packet NPCs.
    aliases:
    - dnpc
permissions:
  dreamnpc.admin:
    description: Manage DreamNPC instances.
    default: op
