name:
  # Entries correspond one-to-one with name lines from top to bottom.
  # Each value is the gap to the next line; the final value is always 0.0.
  # Additional lines reuse the last configured gap.
  line-spacing:
    - 0.3
    - 0.0
  offset: 2.3
  view-distance: 32.0
selection:
  range: 6.0
  radius: 0.75
  # 选中的 NPC 需要手持此材质并潜行左键方块才会移动。
  stick-material: STICK
debug:
  orientation: false
