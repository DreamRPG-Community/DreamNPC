plugins {
    id "java-library"
}

group = "self-written"
def buildVersion = providers.gradleProperty("projectVersion").getOrElse("1.0.0")
version = buildVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    options.compilerArgs.add("-Xlint:all")
    // Paper 1.12.2 bundles an old Guava annotation without its Error Prone companion classes.
    options.compilerArgs.add("-Xlint:-classfile")
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.named("processResources") {
    filesMatching("plugin.yml") {
        expand(version: buildVersion)
    }
}

tasks.withType(Jar).configureEach {
    archiveBaseName = project.name
    archiveVersion = ""
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named("jar") {
    from("THIRD-PARTY-NOTICES.md")
    from({ configurations.npcEmbedded.collect { zipTree(it) } }) {
        include "cn/mythicland/npclib/**", "cn/mythicland/framework/bukkit/reflect/**"
    }
}

def paperApiVersion = "1.12.2-R0.1-20190714.184133-413"

configurations {
    npcEmbedded { transitive = false }
    compileClasspath.extendsFrom(npcEmbedded)
    testRuntimeClasspath.extendsFrom(npcEmbedded)
}

dependencies {
    npcEmbedded("cn.mythicland:mythic-npclib:1.0.0")
    npcEmbedded("cn.mythicland:mythic-framework-bukkit:1.0.0")
    compileOnly("com.destroystokyo.paper:paper-api:${paperApiVersion}")
    compileOnly("self-written:DreamLib:${project.version}")
    compileOnly(files("../../../cache/patched_1.12.2.jar"))

    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.2")
    testImplementation("com.destroystokyo.paper:paper-api:${paperApiVersion}")
    testRuntimeOnly("self-written:DreamLib:${project.version}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.10.2")
}
