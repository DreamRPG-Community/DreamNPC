import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral()
        maven {
            name = "Paper"
            url = uri("https://repo.papermc.io/repository/maven-public/")
        }
    }
}

includeBuild("../DreamLib") {
    dependencySubstitution {
        substitute module("self-written:DreamLib") using project(":")
    }
}

includeBuild("../../../../MythicLand/plugins/MythicNPCLib")

rootProject.name = "DreamNPC"
